<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Books Arpit Sidana has read and plans to read, organized by genre.">
  <title>Bookshelf — Arpit Sidana</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="site-shell bookshelf-shell">
    <a class="backlink" href="index.html">arpit sidana</a>
    <p class="eyebrow">library</p>
    <h1>Bookshelf</h1>
    <p class="bookshelf-intro">Books that shaped how I think, plus the ones waiting on the shelf.</p>
    <div class="bookshelf-toolbar">
      <nav class="book-filters" id="book-filters" aria-label="Filter books by genre"></nav>
      <label class="book-search-wrap">
        <span class="sr-only">Search books</span>
        <input id="book-search" type="search" placeholder="search titles or authors" autocomplete="off">
      </label>
    </div>
    <p class="book-results" id="book-results" aria-live="polite"></p>
    <section class="bookshelf-grid" id="bookshelf-grid" aria-label="Books"></section>
    <p class="bookshelf-empty" id="bookshelf-empty" hidden>No books match that filter.</p>
  </main>
  <script src="reads.js"></script>
</body>
</html>
